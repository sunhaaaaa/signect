<!doctype html>
<html>
<head>
<style>
  body { background: #CFE8FF; display: flex; gap: 24px; align-items: flex-start; justify-content: center; min-height: 100vh; margin:0; font-family: sans-serif; flex-wrap: wrap; padding: 20px; box-sizing: border-box; }
  .box { background: #FFFDF6; padding: 16px; border: 4px solid #1B1B2F; display:flex; flex-direction:column; align-items:center; gap:8px; }
</style>
</head>
<body>
  <div class="box">
    <span>mascot 256px</span>
    <svg width="256" height="288" viewBox="0 0 16 18" shape-rendering="crispEdges">
      <!-- shadow -->
      <g transform="translate(0.8,0.8)" fill="#00000040">
        <rect x="7" y="0" width="2" height="9"/>
        <rect x="4" y="2" width="2" height="7"/>
        <rect x="10" y="2" width="2" height="7"/>
        <rect x="13" y="4" width="2" height="5"/>
        <rect x="0" y="7" width="3" height="4"/>
        <rect x="2" y="8" width="12" height="8"/>
      </g>
      <!-- outline pass (offset by 1px in 8 directions cheaply via a few key offsets) -->
      <g fill="#1B1B2F">
        <rect x="6" y="-1" width="4" height="11"/>
        <rect x="3" y="1" width="4" height="9"/>
        <rect x="9" y="1" width="4" height="9"/>
        <rect x="12" y="3" width="4" height="7"/>
        <rect x="-1" y="6" width="5" height="6"/>
        <rect x="1" y="7" width="14" height="10"/>
      </g>
      <!-- hand fill -->
      <g fill="#FFC531">
        <rect x="7" y="0" width="2" height="9"/>
        <rect x="4" y="2" width="2" height="7"/>
        <rect x="10" y="2" width="2" height="7"/>
        <rect x="13" y="4" width="2" height="5"/>
        <rect x="0" y="7" width="3" height="4"/>
        <rect x="2" y="8" width="12" height="8"/>
      </g>
      <!-- face -->
      <g fill="#1B1B2F">
        <rect x="5" y="10" width="2" height="2"/>
        <rect x="9" y="10" width="2" height="2"/>
        <rect x="6" y="13" width="4" height="1"/>
      </g>
    </svg>
  </div>
</body>
</html>
